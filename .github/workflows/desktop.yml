name: Windows desktop build

# Builds the Bunny AI Windows installer (.exe) with Tauri.
# Set the repository variable BUNNY_APP_URL (Settings > Secrets and variables >
# Actions > Variables) to your deployed site, e.g. https://your-app.vercel.app
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install tooling
        working-directory: desktop
        run: npm ci
      - name: Build installer
        working-directory: desktop
        env:
          BUNNY_APP_URL: ${{ vars.BUNNY_APP_URL }}
        run: |
          if (-not $env:BUNNY_APP_URL) { throw "Set the BUNNY_APP_URL repository variable to your deployed site URL." }
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-ai-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
